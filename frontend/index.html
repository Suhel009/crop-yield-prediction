<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crop Yield Prediction</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌾 Crop Yield Prediction</h1>

        <p class="subtitle">
            Predict crop yield using machine learning
        </p>

        <form id="predictionForm">

            <label>Year</label>
           <input type="number" id="year" min="2000" max="2026" required>

           
            <label>State</label>
            <select id="state" required>
                <option value="">Loading states...</option>
                <option value="Madhya Pradesh">Madhya Pradesh</option>
                <option value="Punjab">Punjab</option>
                <option value="Haryana">Haryana</option>
                <option value="Uttar Pradesh">Uttar Pradesh</option>
                <option value="Bihar">Bihar</option>
                <option value="Karnataka">Karnataka</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="Maharashtra">Maharashtra</option>
            </select>


            <label>Crop</label>
            <select id="crop" required>
                <option value="">Loading crops...</option>
                <option value="Wheat">Wheat</option>
                <option value="Rice">Rice</option>
                <option value="Maize">Maize</option>
                <option value="Sugarcane">Sugarcane</option>
                <option value="Cotton(lint)">Cotton(lint)</option>
                <option value="Potato">Potato</option>
                <option value="Onion">Onion</option>
            </select>


            <label>Season</label>
            <select id="season" required>
                <option value="">Loading seasons...</option>
                <option value="Rabi">Rabi</option>
                <option value="Kharif">Kharif</option>
                <option value="Whole Year">Whole Year</option>
                <option value="Summer">Summer</option>
                <option value="Winter">Winter</option>
                <option value="Autumn">Autumn</option>
            </select>


            <label>Area</label>
            <input type="number" id="area" min="0.01" step="any" required>


            <label>Annual Rainfall</label>
            <input type="number" id="rainfall" min="0" step="any" required>


            <label>Fertilizer</label>
            <input type="number" id="fertilizer" min="0" step="any" required>


            <label>Pesticide</label>
            <input type="number" id="pesticide" min="0" step="any" required>


            <button type="submit">
                Predict Yield
            </button>

        </form>


        <div id="result" class="result">
            Prediction will appear here
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
