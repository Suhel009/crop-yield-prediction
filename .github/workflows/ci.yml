name: Project checks

on:
  push:
    branches: ["main", "upgrade/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API test dependencies
        run: python -m pip install --upgrade pip flask flask-cors numpy pandas joblib
      - name: Run API tests
        run: python -m unittest discover -s tests -v
      - name: Check frontend JavaScript syntax
        run: node --check frontend/script.js
